<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Akademi Perikanan & Akuakultur Modern | Platform Edukasi</title>
    <!-- Google Fonts & Tailwind + Plugins -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Framer Motion via ESM (React) - Kita akan gunakan React + ReactDOM dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <!-- Framer Motion CDN (UMD) -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom style overrides -->
    <style>
        /* custom smooth scroll & glassmorphism extras */
        html {
            scroll-behavior: smooth;
        }
        body {
            background: linear-gradient(135deg, #05161e 0%, #0a2a36 50%, #083c4a 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        /* inter font import */
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap');
        * {
            font-family: 'Inter', sans-serif;
        }
        /* glass morphism effect global helper */
        .glass-card {
            background: rgba(8, 45, 58, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        .neon-glow {
            transition: all 0.3s ease;
        }
        .neon-glow:hover {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 5px rgba(0, 200, 255, 0.4);
            border-color: rgba(0, 255, 255, 0.6);
        }
        .bubble {
            position: absolute;
            background: radial-gradient(circle, rgba(0,255,255,0.3), rgba(0,150,200,0.1));
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble linear infinite;
            z-index: 0;
        }
        @keyframes floatBubble {
            0% { transform: translateY(100vh) scale(0.4); opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .wave-divider {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(2,30,45,0.8)" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            background-repeat: no-repeat;
            height: 80px;
            width: 100%;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        /* custom progress / gauge style */
        .gauge-fill {
            transition: width 0.4s ease;
        }
        .tab-active {
            background: rgba(0, 255, 255, 0.2);
            border-bottom: 2px solid #0ff;
            color: #0ff;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-open .accordion-content {
            max-height: 800px;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ================ DATA DAN KOMPONEN REACT DENGAN FRAMER MOTION ==============
    const { useState, useEffect, useRef } = React;
    // Framer motion dari CDN global
    const { motion, AnimatePresence } = FramerMotion;

    // ----- Icon Components (simulasi lucide, kita pakai Lucide global setelah mounted)
    // tapi kita akan render dengan data-icon, lalu lucide.createIcons di useEffect
    // agar lebih rapi, kita buat wrapper

    // Data Statistik Cards
    const statCards = [
        { title: "Teknologi Akuakultur", value: "12+", icon: "cpu", color: "#00d4ff" },
        { title: "Sistem Budidaya", value: "8", icon: "waves", color: "#20c4f4" },
        { title: "Penyakit Ikan", value: "15+", icon: "alert-triangle", color: "#f97316" },
        { title: "Nutrisi & Pakan", value: "24", icon: "fish", color: "#22c55e" },
        { title: "Bisnis Perikanan", value: "6", icon: "trending-up", color: "#a855f7" },
        { title: "Manajemen Air", value: "9", icon: "droplet", color: "#0ea5e9" }
    ];

    // Data Materi Accordion + Tabs (PILAR 1 hingga 4)
    // Setiap judul bisa diklik -> buka link materi eksternal (contoh #, tapi user bisa ganti)
    const materiPilar = [
        { id: "pilar1", title: "🏭 PILAR PRODUKSI & MANAJEMEN BUDIDAYA", items: [
            { name: "Dasar-Dasar Akuakultur (Sistem Budidaya, RAS, Bioflok)", link: "#materi-dasar-akua" },
            { name: "Pembenihan & Pemuliaan Biota Air", link: "#materi-pembenihan" },
            { name: "Manajemen Akuakultur (Tawar, Payau, Laut)", link: "#materi-manajemen" },
            { name: "Teknologi Budidaya Pakan Alami (Fitoplankton, Artemia, dll)", link: "#materi-pakan-alami" }
        ] },
        { id: "pilar2", title: "🩺 PILAR KESEHATAN BIOTA AIR & LINGKUNGAN", items: [
            { name: "Limnologi & Oseanografi", link: "#materi-limnologi" },
            { name: "Manajemen Kualitas Air (DO, Amonia, pH, dll)", link: "#materi-kualitas-air" },
            { name: "Hama dan Penyakit Ikan (WSSV, Aeromonas, Biosekuriti)", link: "#materi-penyakit" },
            { name: "Imunologi Organisme Akuatik", link: "#materi-imunologi" }
        ] },
        { id: "pilar3", title: "🧬 PILAR BIOLOGI, NUTRISI & FISIOLOGI", items: [
            { name: "Ikhtiologi (Anatomi & Morfologi Ikan)", link: "#materi-ikhtiologi" },
            { name: "Nutrisi & Teknologi Pakan Ikan (Protein, EPA/DHA, Pelet)", link: "#materi-nutrisi" },
            { name: "Fisiologi Hewan Air & Endokrinologi", link: "#materi-fisiologi" }
        ] },
        { id: "pilar4", title: "📊 PILAR BISNIS & SOSIAL EKONOMI", items: [
            { name: "Kewirausahaan Perikanan & Ekspor", link: "#materi-wirausaha" },
            { name: "Analisis Kelayakan Usaha (NPV, IRR, R/C Ratio)", link: "#materi-kelayakan" },
            { name: "Penyuluhan & Komunikasi Perikanan", link: "#materi-penyuluhan" }
        ] }
    ];

    // FAQ data
    const faqs = [
        { q: "Apakah platform ini gratis?", a: "Ya, akses dasar gratis untuk semua materi pengantar. Modul premium tersedia untuk sertifikasi." },
        { q: "Bagaimana cara mengakses materi lengkap?", a: "Klik judul materi dan akan diarahkan ke halaman pembelajaran masing-masing." },
        { q: "Apakah ada sertifikat setelah belajar?", a: "Tersedia ujian dan sertifikat untuk program profesional." },
    ];

    // =============== KOMPONEN ================
    const Navbar = () => {
        const [mobileMenu, setMobileMenu] = useState(false);
        const menuItems = ["Home", "Materi", "Akuakultur", "Penyakit Ikan", "Nutrisi", "Bisnis", "Kontak"];
        return (
            <motion.nav initial={{ y: -80 }} animate={{ y: 0 }} transition={{ duration: 0.5 }} className="fixed top-0 left-0 w-full z-50 bg-[#05161e]/80 backdrop-blur-xl border-b border-cyan-500/30 shadow-lg">
                <div className="container mx-auto px-4 md:px-8 py-3 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="w-9 h-9 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg">
                            <span className="text-white text-xl font-bold">🐟</span>
                        </div>
                        <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-300 to-blue-400 bg-clip-text text-transparent">Akademi Perikanan</h1>
                    </div>
                    <div className="hidden md:flex space-x-6 text-gray-200 font-medium">
                        {menuItems.map(item => <a key={item} href="#" className="hover:text-cyan-300 transition-colors duration-200">{item}</a>)}
                    </div>
                    <motion.button whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} className="bg-gradient-to-r from-cyan-500 to-blue-600 px-5 py-2 rounded-full text-white font-semibold shadow-md shadow-cyan-500/30">Mulai Belajar</motion.button>
                    <div className="md:hidden cursor-pointer text-white" onClick={() => setMobileMenu(!mobileMenu)}>☰</div>
                </div>
                {mobileMenu && <div className="md:hidden bg-[#0a2a36]/95 backdrop-blur-xl p-4 flex flex-col gap-3 border-t border-cyan-400/30"><a href="#">Home</a><a href="#">Materi</a><a href="#">Akuakultur</a><a href="#">Penyakit Ikan</a><a href="#">Nutrisi</a><a href="#">Bisnis</a><a href="#">Kontak</a></div>}
            </motion.nav>
        );
    };

    // Hero + Bubbles Animation
    const Hero = () => {
        useEffect(() => {
            const container = document.getElementById('bubble-container');
            if(!container) return;
            for(let i=0;i<35;i++) createBubble(container);
            function createBubble(parent){
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 60 + 20;
                bubble.style.width = size+'px';
                bubble.style.height = size+'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = Math.random() * 8 + 5 + 's';
                bubble.style.animationDelay = Math.random() * 10 + 's';
                parent.appendChild(bubble);
            }
        }, []);
        return (
            <section className="relative pt-32 pb-24 md:pt-44 overflow-hidden">
                <div id="bubble-container" className="absolute inset-0 w-full h-full pointer-events-none"></div>
                <div className="container mx-auto px-6 relative z-10 text-center">
                    <motion.div initial={{ opacity: 0, y: 30 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7 }}>
                        <h1 className="text-5xl md:text-7xl font-extrabold bg-gradient-to-r from-white via-cyan-200 to-sky-400 bg-clip-text text-transparent drop-shadow-2xl">Akademi Perikanan &<br/>Akuakultur Modern</h1>
                        <p className="text-gray-200 text-lg md:text-xl max-w-3xl mx-auto mt-6 backdrop-blur-sm bg-black/20 p-3 rounded-2xl">Platform pembelajaran interaktif tentang budidaya ikan, teknologi akuakultur, kesehatan biota air, nutrisi, dan bisnis perikanan modern.</p>
                        <div className="flex flex-wrap justify-center gap-5 mt-10">
                            <motion.button whileHover={{ scale: 1.05, boxShadow: "0 0 20px cyan" }} className="px-8 py-3 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-lg">Jelajahi Materi →</motion.button>
                            <motion.button whileHover={{ scale: 1.05 }} className="px-8 py-3 rounded-full border border-cyan-400 backdrop-blur text-white">Virtual Tour</motion.button>
                        </div>
                    </motion.div>
                </div>
                <div className="absolute bottom-0 w-full"><div className="wave-divider"></div></div>
            </section>
        );
    };

    // Dashboard Statistik Cards
    const DashboardStats = () => {
        return (
            <section className="py-16 px-4 container mx-auto">
                <h2 className="text-3xl md:text-4xl font-bold text-center text-white mb-12">📈 Dashboard <span className="text-cyan-300">Statistik Akademik</span></h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    {statCards.map((card, idx) => (
                        <motion.div key={idx} whileHover={{ y: -8, scale: 1.02 }} className="glass-card rounded-2xl p-6 neon-glow transition-all duration-300">
                            <div className="flex items-center justify-between">
                                <div className="text-4xl" style={{color: card.color}}>
                                    {card.icon === "cpu" && "🖥️"}{card.icon === "waves" && "🌊"}{card.icon === "alert-triangle" && "⚠️"}{card.icon === "fish" && "🐟"}{card.icon === "trending-up" && "📈"}{card.icon === "droplet" && "💧"}
                                </div>
                                <span className="text-4xl font-black text-white">{card.value}</span>
                            </div>
                            <h3 className="text-xl font-semibold text-white mt-4">{card.title}</h3>
                            <div className="mt-2 w-full h-1 bg-gray-600 rounded-full overflow-hidden"><div className="h-full w-3/4 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full"></div></div>
                        </motion.div>
                    ))}
                </div>
            </section>
        );
    };

    // Accordion Materi Utama: Setiap judul kategori -> mapping link klik
    const MateriAccordion = () => {
        const [openIdx, setOpenIdx] = useState(null);
        const toggle = (idx) => setOpenIdx(openIdx === idx ? null : idx);
        return (
            <section className="container mx-auto px-4 py-20" id="materi-utama">
                <motion.div initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} className="text-center mb-12">
                    <h2 className="text-4xl font-bold text-white">📚 Kurikulum <span className="text-cyan-300">Premium</span></h2>
                    <p className="text-gray-300 max-w-2xl mx-auto mt-3">Klik judul materi untuk membuka halaman pembelajaran lengkap.</p>
                </motion.div>
                <div className="max-w-5xl mx-auto space-y-5">
                    {materiPilar.map((pilar, idx) => (
                        <div key={pilar.id} className={`glass-card rounded-2xl overflow-hidden transition-all ${openIdx === idx ? 'accordion-open' : ''}`}>
                            <button onClick={() => toggle(idx)} className="w-full flex justify-between items-center p-6 text-left text-xl font-bold text-white bg-gradient-to-r from-cyan-900/30 to-transparent">
                                {pilar.title} <span className="text-cyan-300 text-2xl">{openIdx === idx ? '▲' : '▼'}</span>
                            </button>
                            <div className="accordion-content">
                                <div className="p-6 pt-0 grid gap-3">
                                    {pilar.items.map((item, subIdx) => (
                                        <a key={subIdx} href={item.link} target="_blank" rel="noopener noreferrer" className="group flex items-center justify-between p-4 rounded-xl bg-black/30 border border-white/10 hover:border-cyan-400 transition-all hover:bg-cyan-900/30">
                                            <span className="text-gray-200 font-medium group-hover:text-cyan-300">{item.name}</span>
                                            <span className="text-cyan-400 text-sm opacity-70 group-hover:opacity-100">🔗 Buka Materi →</span>
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </section>
        );
    };

    // Komponen Tabs Manajemen Air & Gauge visual (Kualitas Air)
    const WaterQualityGauge = () => {
        const params = [{ label: "DO (mg/L)", value: 6.2, max: 10, color: "#2dd4bf" },{ label: "Amonia", value: 0.2, max: 1, color: "#f97316" },{ label: "Nitrit", value: 0.1, max: 0.5, color: "#facc15" },{ label: "pH", value: 7.4, max: 9, color: "#38bdf8" }];
        return (
            <div className="bg-black/30 rounded-2xl p-6 backdrop-blur-sm">
                <h4 className="text-2xl font-semibold text-white mb-5">🔬 Dashboard Monitoring Kualitas Air</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {params.map((p,i)=>(
                        <div key={i}><div className="flex justify-between"><span className="text-gray-300">{p.label}</span><span className="text-cyan-300 font-bold">{p.value} / {p.max}</span></div><div className="w-full bg-gray-700 rounded-full h-3 mt-1"><div className="h-3 rounded-full gauge-fill" style={{width: `${(p.value/p.max)*100}%`, backgroundColor: p.color}}></div></div></div>
                    ))}
                </div>
                <div className="mt-4 text-xs text-cyan-200/70 italic">* Simulasi real-time monitoring parameter penting</div>
            </div>
        );
    };

    // bagian tambahan (kesehatan & scientific cards)
    const ScientificHighlight = () => (
        <div className="container mx-auto px-4 py-10 grid md:grid-cols-3 gap-6">
            <div className="glass-card p-5 rounded-2xl neon-glow"><div className="text-3xl mb-2">🦠</div><h3 className="text-white text-xl">Biosekuriti & Vaksinasi</h3><p className="text-gray-300 text-sm">Sistem imun ikan, probiotik Bacillus, vaksinasi modern untuk pencegahan WSSV.</p><span className="inline-block mt-3 text-cyan-300 text-xs">🔗 Pelajari lebih lanjut</span></div>
            <div className="glass-card p-5 rounded-2xl neon-glow"><div className="text-3xl mb-2">🧪</div><h3 className="text-white text-xl">Nutrisi & Pakan Pelet</h3><p className="text-gray-300 text-sm">Formulasi pakan, floating feed, kebutuhan protein dan EPA/DHA.</p><span className="inline-block mt-3 text-cyan-300 text-xs">🔗 Buka modul Nutrisi</span></div>
            <div className="glass-card p-5 rounded-2xl neon-glow"><div className="text-3xl mb-2">📊</div><h3 className="text-white text-xl">Analisis Bisnis Perikanan</h3><p className="text-gray-300 text-sm">NPV, IRR, R/C ratio dan manajemen risiko budidaya udang ekspor.</p><span className="inline-block mt-3 text-cyan-300 text-xs">🔗 Kalkulator bisnis</span></div>
        </div>
    );

    // FAQ Modern
    const FAQModern = () => {
        return (
            <section className="container mx-auto px-4 py-16">
                <h2 className="text-3xl font-bold text-center text-white">❄️ Pertanyaan Umum</h2>
                <div className="max-w-3xl mx-auto mt-10 space-y-4">
                    {faqs.map((faq,i)=>(
                        <div key={i} className="glass-card rounded-xl p-5">
                            <h3 className="text-white font-bold text-lg">{faq.q}</h3>
                            <p className="text-gray-300 mt-2">{faq.a}</p>
                        </div>
                    ))}
                </div>
            </section>
        );
    };

    // Footer Premium
    const Footer = () => (
        <footer className="bg-[#02161f] border-t border-cyan-800/50 mt-20 py-10">
            <div className="container mx-auto px-6 grid md:grid-cols-4 gap-8">
                <div><div className="flex items-center gap-2"><span className="text-2xl">🐟</span><span className="text-white font-bold">Akademi Perikanan</span></div><p className="text-gray-400 text-sm mt-2">Mencetak ahli akuakultur masa depan</p></div>
                <div><h4 className="text-white font-semibold">Jelajahi</h4><ul className="text-gray-400 text-sm space-y-1 mt-2"><li>Materi Budidaya</li><li>Teknologi RAS</li><li>Kesehatan Ikan</li></ul></div>
                <div><h4 className="text-white font-semibold">Sumber Daya</h4><ul className="text-gray-400 text-sm space-y-1 mt-2"><li>E-Book Gratis</li><li>Webinar</li><li>Komunitas</li></ul></div>
                <div><h4 className="text-white font-semibold">Ikuti Kami</h4><div className="flex gap-3 mt-2 text-cyan-300">🌊🐙📘</div></div>
            </div>
            <div className="text-center text-gray-500 text-xs mt-8">© 2025 Akademi Perikanan Modern – Revolusi Akuakultur Nusantara</div>
        </footer>
    );

    // Main App Component
    const App = () => {
        useEffect(() => {
            if (window.lucide) { window.lucide.createIcons(); }
            // re-trigger gauge fill after mount
            const gauges = document.querySelectorAll('.gauge-fill');
            gauges.forEach(g => { const width = g.style.width; g.style.width = '0%'; setTimeout(() => g.style.width = width, 50); });
        }, []);
        return (
            <div className="relative overflow-x-hidden">
                <Navbar />
                <Hero />
                <DashboardStats />
                <MateriAccordion />
                {/* Section manajemen air + showcase */}
                <div className="container mx-auto px-4 my-8">
                    <div className="glass-card rounded-3xl p-6 md:p-8">
                        <WaterQualityGauge />
                    </div>
                </div>
                <ScientificHighlight />
                <FAQModern />
                <Footer />
                {/* floating particles extra glow */}
                <div className="fixed bottom-5 right-5 w-3 h-3 rounded-full bg-cyan-300 blur-sm animate-pulse"></div>
                <div className="fixed top-1/3 left-5 w-2 h-2 rounded-full bg-cyan-400 blur animate-ping"></div>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    // initial lucide icons
    setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 100);
</script>
</body>
</html>
